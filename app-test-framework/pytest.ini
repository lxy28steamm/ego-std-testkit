[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    flow_tasks: authenticated task navigation and filters
    flow_settings: language, version and log export
    flow_connect: connect an explicitly configured EGO
    flow_parameters: reversible IMU configuration change
    flow_record: starts a real short recording with cleanup
    flow_upload: backs up and modifies a selected test MCAP, then uploads
    device: requires an Android device and Appium server
    smoke: core smoke checks
log_cli = true
log_cli_level = INFO
log_file_level = INFO
